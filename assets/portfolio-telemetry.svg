<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" role="img" aria-label="Tejas Bargat Portfolio Telemetry">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3a86ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(-420px); }
      100% { transform: translateY(420px); }
    }
    @keyframes pulse-green {
      0%, 100% { opacity: 1; r: 4.5; }
      50% { opacity: 0.4; r: 3.5; }
    }
    @keyframes pulse-cyan {
      0%, 100% { opacity: 1; r: 4.5; }
      50% { opacity: 0.35; r: 3.5; }
    }
    @keyframes pulse-amber {
      0%, 100% { opacity: 1; r: 4.5; }
      50% { opacity: 0.45; r: 3.5; }
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes border-glow {
      0%, 100% { stroke: #00d2ff; stroke-opacity: 0.7; }
      50% { stroke: #3a86ff; stroke-opacity: 0.35; }
    }

    .bg-box { fill: url(#bgGrad); stroke: #00d2ff; stroke-width: 1.5; animation: border-glow 4s ease-in-out infinite; rx: 12px; }
    .term-title { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 13px; fill: #8892b0; }
    .term-code { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 13px; fill: #00d2ff; }
    .cursor { fill: #00d2ff; animation: cursor-blink 1s infinite; }
    .card-bg { fill: #090e1a; stroke: #1e293b; stroke-width: 1; rx: 8px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .tag-text { font-family: 'Fira Code', monospace; font-size: 10px; fill: #38bdf8; }
    .badge-text { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 700; }
    .stat-val { font-family: 'Fira Code', monospace; font-size: 18px; font-weight: 800; fill: #00d2ff; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; letter-spacing: 1px; }
    .scanner { animation: scanline 6s linear infinite; }

    .dot-green { fill: #10b981; animation: pulse-green 2s infinite; }
    .dot-cyan { fill: #00d2ff; animation: pulse-cyan 2.2s infinite; }
    .dot-amber { fill: #f59e0b; animation: pulse-amber 1.8s infinite; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="416" class="bg-box" />

  <!-- Scanning Line -->
  <g clip-path="url(#boxClip)">
    <clipPath id="boxClip">
      <rect x="2" y="2" width="896" height="416" rx="12" />
    </clipPath>
    <rect x="0" y="0" width="900" height="80" fill="url(#scanGrad)" class="scanner" />
  </g>

  <!-- Terminal Header Bar -->
  <rect x="2" y="2" width="896" height="42" fill="#080c14" rx="12" />
  <rect x="2" y="32" width="896" height="12" fill="#080c14" />
  <line x1="2" y1="44" x2="898" y2="44" stroke="#1e293b" stroke-width="1" />

  <!-- Terminal Window Dots -->
  <circle cx="22" cy="23" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="38" cy="23" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="54" cy="23" r="5" fill="#10b981" opacity="0.8" />

  <!-- Terminal Prompt -->
  <text x="75" y="27" class="term-title">tejas@termux-android:<tspan fill="#3a86ff">~/portfolio</tspan>$</text>
  <text x="315" y="27" class="term-code">nexus-ai telemetry --status=active</text>
  <rect x="600" y="16" width="8" height="14" class="cursor" />

  <!-- Live Status Chip (Right) -->
  <g transform="translate(735, 13)">
    <rect width="145" height="20" rx="10" fill="#0d1b2a" stroke="#00d2ff" stroke-width="0.8" />
    <circle cx="12" cy="10" r="4" class="dot-green" />
    <text x="24" y="14" font-family="'Fira Code', monospace" font-size="10" fill="#00d2ff" font-weight="700">SYSTEM: ACTIVE</text>
  </g>

  <!-- 6 Project Telemetry Grid (2 rows x 3 columns) -->

  <!-- Card 1: Nexus AI -->
  <g transform="translate(24, 60)">
    <rect width="268" height="100" class="card-bg" />
    <circle cx="20" cy="24" r="4.5" class="dot-cyan" />
    <text x="32" y="27" class="card-title">01 · Nexus AI</text>
    <rect x="185" y="14" width="70" height="16" rx="4" fill="#003547" />
    <text x="220" y="25" text-anchor="middle" class="badge-text" fill="#00d2ff">BUILDING</text>
    <text x="16" y="52" class="card-desc">Mobile-first personal AI assistant concept</text>
    <text x="16" y="68" class="card-desc">Multi-LLM routing, memory &amp; Termux CLI</text>
    <text x="16" y="87" class="tag-text">Python · FastAPI · SQLite · Termux</text>
  </g>

  <!-- Card 2: Dual Water Tank -->
  <g transform="translate(316, 60)">
    <rect width="268" height="100" class="card-bg" />
    <circle cx="20" cy="24" r="4.5" class="dot-cyan" />
    <text x="32" y="27" class="card-title">02 · Dual Water Tank</text>
    <rect x="180" y="14" width="75" height="16" rx="4" fill="#003547" />
    <text x="217" y="25" text-anchor="middle" class="badge-text" fill="#00d2ff">PROTOTYPE</text>
    <text x="16" y="52" class="card-desc">Automated fluid level &amp; pump control</text>
    <text x="16" y="68" class="card-desc">Dual ultrasonic sensing &amp; relay cutoff</text>
    <text x="16" y="87" class="tag-text">ESP32 · Arduino · Embedded C · Relays</text>
  </g>

  <!-- Card 3: 8051 Solar Tracker -->
  <g transform="translate(608, 60)">
    <rect width="268" height="100" class="card-bg" />
    <circle cx="20" cy="24" r="4.5" class="dot-cyan" />
    <text x="32" y="27" class="card-title">03 · 8051 Solar Tracker</text>
    <rect x="180" y="14" width="75" height="16" rx="4" fill="#003547" />
    <text x="217" y="25" text-anchor="middle" class="badge-text" fill="#00d2ff">PROTOTYPE</text>
    <text x="16" y="52" class="card-desc">Light-seeking energy automation MCU</text>
    <text x="16" y="68" class="card-desc">Differential LDR bridge &amp; motor driver</text>
    <text x="16" y="87" class="tag-text">8051 MCU · LDRs · Stepper Motor</text>
  </g>

  <!-- Card 4: Tejas 2.0 Portfolio -->
  <g transform="translate(24, 175)">
    <rect width="268" height="100" class="card-bg" />
    <circle cx="20" cy="24" r="4.5" class="dot-green" />
    <text x="32" y="27" class="card-title">04 · Tejas 2.0 Portfolio</text>
    <rect x="185" y="14" width="70" height="16" rx="4" fill="#064e3b" />
    <text x="220" y="25" text-anchor="middle" class="badge-text" fill="#10b981">DEPLOYED</text>
    <text x="16" y="52" class="card-desc">Engineering showcase &amp; NEXUS AI</text>
    <text x="16" y="68" class="card-desc">36-skill taxonomy &amp; telemetry engine</text>
    <text x="16" y="87" class="tag-text">React 19 · Vite 8 · JavaScript · Pages</text>
  </g>

  <!-- Card 5: Programming Journey -->
  <g transform="translate(316, 175)">
    <rect width="268" height="100" class="card-bg" />
    <circle cx="20" cy="24" r="4.5" class="dot-amber" />
    <text x="32" y="27" class="card-title">05 · Learning Journey</text>
    <rect x="185" y="14" width="70" height="16" rx="4" fill="#451a03" />
    <text x="220" y="25" text-anchor="middle" class="badge-text" fill="#f59e0b">ACTIVE</text>
    <text x="16" y="52" class="card-desc">Daily public coding &amp; LeetCode streak</text>
    <text x="16" y="68" class="card-desc">Python (Day 13+), Java &amp; C on Android</text>
    <text x="16" y="87" class="tag-text">Python · Java · C · Termux · Git</text>
  </g>

  <!-- Card 6: CampusCare AI -->
  <g transform="translate(608, 175)">
    <rect width="268" height="100" class="card-bg" />
    <circle cx="20" cy="24" r="4.5" class="dot-cyan" />
    <text x="32" y="27" class="card-title">06 · CampusCare AI</text>
    <rect x="185" y="14" width="70" height="16" rx="4" fill="#003547" />
    <text x="220" y="25" text-anchor="middle" class="badge-text" fill="#00d2ff">BUILDING</text>
    <text x="16" y="52" class="card-desc">AI campus complaint management</text>
    <text x="16" y="68" class="card-desc">Priority classification &amp; admin panel</text>
    <text x="16" y="87" class="tag-text">Flutter · FastAPI · Python · REST APIs</text>
  </g>

  <!-- Bottom Telemetry HUD Bar -->
  <g transform="translate(24, 290)">
    <rect width="852" height="105" rx="8" fill="#070c16" stroke="#1e293b" stroke-width="1" />
    
    <!-- Stat 1 -->
    <g transform="translate(45, 25)">
      <text x="0" y="0" class="stat-val">36</text>
      <text x="0" y="22" class="stat-lbl">SKILLS TRACKED</text>
      <text x="0" y="42" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8">Electronics · AI · Web</text>
    </g>
    <line x1="240" y1="20" x2="240" y2="85" stroke="#1e293b" stroke-width="1" />

    <!-- Stat 2 -->
    <g transform="translate(270, 25)">
      <text x="0" y="0" class="stat-val">06</text>
      <text x="0" y="22" class="stat-lbl">FEATURED BUILDS</text>
      <text x="0" y="42" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8">Hardware &amp; AI Systems</text>
    </g>
    <line x1="455" y1="20" x2="455" y2="85" stroke="#1e293b" stroke-width="1" />

    <!-- Stat 3 -->
    <g transform="translate(485, 25)">
      <text x="0" y="0" class="stat-val">TERMUX</text>
      <text x="0" y="22" class="stat-lbl">TOOLCHAIN ON ANDROID</text>
      <text x="0" y="42" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8">Linux Dev Environment</text>
    </g>
    <line x1="675" y1="20" x2="675" y2="85" stroke="#1e293b" stroke-width="1" />

    <!-- Stat 4 -->
    <g transform="translate(705, 25)">
      <text x="0" y="0" class="stat-val">GATE 2028</text>
      <text x="0" y="22" class="stat-lbl">ACADEMIC HORIZON</text>
      <text x="0" y="42" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8">ECE &amp; CSE Synergy</text>
    </g>
  </g>
</svg>

