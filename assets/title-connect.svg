<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="06 Connect: Let&#x27;s build something.">
<defs><linearGradient id="l" gradientUnits="userSpaceOnUse" x1="40" x2="1160"><stop offset="0" stop-color="#7FE8FF"/><stop offset=".6" stop-color="#00D9FF"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></linearGradient>
<linearGradient id="s" gradientUnits="userSpaceOnUse" x1="-300" x2="0"><stop offset="0" stop-color="#7FE8FF"/><stop offset=".5" stop-color="#EAFBFF"/><stop offset="1" stop-color="#7FE8FF"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="p"><stop offset="0" stop-color="#EAFBFF"/><stop offset=".5" stop-color="#7FE8FF" stop-opacity=".6"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></radialGradient></defs><style>
.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.in{animation:in 1.1s cubic-bezier(.16,1,.3,1) both}.d2{animation-delay:.2s}.d3{animation-delay:.45s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.in{animation:none}.draw{animation:none;stroke-dashoffset:0}}
</style>
<g class="in"><text class="mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#00D9FF"><tspan fill="#7FE8FF">06</tspan>   CONNECT</text></g>
<g class="in d2"><text class="serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#EAFBFF">Let&#x27;s build <tspan font-style="italic" fill="url(#s)">something.</tspan></text></g>
<g class="in d3"><text class="mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#8FB0BC">SAY HI</text></g>
<path class="draw" d="M40 106H1160" stroke="url(#l)" stroke-width="1"/>
<circle cx="40" cy="106" r="7" fill="url(#p)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle></svg>