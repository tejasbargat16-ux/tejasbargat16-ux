<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" role="img" aria-label="Project 2: DUAL TANK. Monitors two water tanks with ultrasonic sensing, LED status and buzzer alerts."><defs><linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a0a0a"/><stop offset="1" stop-color="#000000"/></linearGradient>
<linearGradient id="f2" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#000000" stop-opacity="0"/><stop offset=".85" stop-color="#000000" stop-opacity=".95"/></linearGradient></defs><style>.d{font-family:Impact,"Bebas Neue","Arial Narrow",Haettenschweiler,sans-serif;letter-spacing:1px}.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.in{animation:in 1s cubic-bezier(.16,1,.3,1) both}.d2{animation-delay:.2s}.d3{animation-delay:.45s}.d4{animation-delay:.7s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 2s cubic-bezier(.65,0,.35,1) .6s both}
@media (prefers-reduced-motion:reduce){.in,.bar{animation:none}}</style><rect width="400" height="560" rx="12" fill="url(#p2)"/><rect width="400" height="560" rx="12" fill="url(#f2)"/>
<rect x=".5" y=".5" width="399" height="559" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".12"/>
<text class="d" x="30" y="230" font-size="220" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3">2</text>
<g class="in"><rect x="28" y="28" width="12" height="22" fill="#E50914"/><text class="s" x="48" y="46" font-size="12" font-weight="700" letter-spacing="3" fill="#FFFFFF">PROJECT</text></g>
<g class="in d2"><text class="d" x="28" y="390" font-size="44" fill="#FFFFFF">DUAL TANK</text><text class="s" x="28" y="418" font-size="14" font-weight="700" fill="#46D369">98% Match <tspan fill="#B3B3B3" font-weight="400"> · Embedded</tspan></text></g>
<text class="s" x="28" y="458" font-size="12" font-weight="700" letter-spacing="1" fill="#FFFFFF">ARDUINO • HC-SR04 • C++</text><text class="s" x="28" y="500" font-size="13" fill="#B3B3B3">Monitors two water tanks with ultrasonic</text><text class="s" x="28" y="520" font-size="13" fill="#B3B3B3">sensing, LED status and buzzer alerts.</text>
