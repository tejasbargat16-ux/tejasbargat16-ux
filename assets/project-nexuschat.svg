<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img">
<defs><linearGradient id="nxb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07121A"/><stop offset="1" stop-color="#050B11"/></linearGradient>
<radialGradient id="nxg" cx="82%" cy="25%" r="60%"><stop offset="0" stop-color="#0B4F6C" stop-opacity=".75"/><stop offset="1" stop-color="#083A50" stop-opacity="0"/></radialGradient>
<pattern id="nxr" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00D9FF" stroke-opacity=".07"/></pattern></defs><style>
.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.in{animation:in 1.1s cubic-bezier(.16,1,.3,1) both}.d2{animation-delay:.2s}.d3{animation-delay:.45s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.in{animation:none}.draw{animation:none;stroke-dashoffset:0}}
</style>
<style>.chip{animation:chip .7s cubic-bezier(.34,1.56,.64,1) both}@keyframes chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.chip{animation:none}}</style>
<rect width="1200" height="330" rx="18" fill="url(#nxb)"/><rect width="1200" height="330" rx="18" fill="url(#nxg)"/><rect width="1200" height="330" rx="18" fill="url(#nxr)"/>
<rect x=".5" y=".5" width="1199" height="329" rx="17.5" fill="none" stroke="#00D9FF" stroke-opacity=".18"/><g class="in"><text class="mono" x="60" y="62" font-size="11" letter-spacing="3" fill="#00D9FF">PROJECT 01 · SOFTWARE</text></g>
<g class="in d2"><text class="serif" x="58" y="130" font-size="44" font-weight="300" fill="#EAFBFF">NEXUS <tspan font-style="italic" fill="#7FE8FF">Chat</tspan></text></g>
<g transform="translate(60,170)"><text class="in d2" y="0" font-size="16" fill="#8FB0BC" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Terminal AI chatbot with multi-provider LLM routing,</text><text class="in d2" y="26" font-size="16" fill="#8FB0BC" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">a Flask API and a Lovable web frontend.</text><text class="in d2" y="52" font-size="16" fill="#8FB0BC" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Built and tested entirely on Android with Termux.</text></g><g class="chip" style="animation-delay:0.50s"><rect x="60" y="270" width="77" height="30" rx="15" fill="#00D9FF" fill-opacity=".1" stroke="#00D9FF" stroke-opacity=".45"/><text class="mono" x="99" y="290" text-anchor="middle" font-size="12" fill="#C9F6FF">Python</text></g><g class="chip" style="animation-delay:0.62s"><rect x="147.2" y="270" width="69" height="30" rx="15" fill="#00D9FF" fill-opacity=".1" stroke="#00D9FF" stroke-opacity=".45"/><text class="mono" x="182" y="290" text-anchor="middle" font-size="12" fill="#C9F6FF">Flask</text></g><g class="chip" style="animation-delay:0.74s"><rect x="226.2" y="270" width="94" height="30" rx="15" fill="#00D9FF" fill-opacity=".1" stroke="#00D9FF" stroke-opacity=".45"/><text class="mono" x="273" y="290" text-anchor="middle" font-size="12" fill="#C9F6FF">LLM APIs</text></g><g class="chip" style="animation-delay:0.86s"><rect x="329.79999999999995" y="270" width="77" height="30" rx="15" fill="#00D9FF" fill-opacity=".1" stroke="#00D9FF" stroke-opacity=".45"/><text class="mono" x="368" y="290" text-anchor="middle" font-size="12" fill="#C9F6FF">SQLite</text></g><g class="chip" style="animation-delay:0.98s"><rect x="416.99999999999994" y="270" width="77" height="30" rx="15" fill="#00D9FF" fill-opacity=".1" stroke="#00D9FF" stroke-opacity=".45"/><text class="mono" x="456" y="290" text-anchor="middle" font-size="12" fill="#C9F6FF">Termux</text></g><g transform="translate(800,70)" class="in" style="animation-delay:0.3s"><text class="mono" font-size="10.5" letter-spacing="2" fill="#00D9FF">PROVIDERS</text><text class="serif" y="38" font-size="32" font-weight="300" fill="#EAFBFF">Multi</text></g><g transform="translate(800,142)" class="in" style="animation-delay:0.5s"><text class="mono" font-size="10.5" letter-spacing="2" fill="#00D9FF">HISTORY</text><text class="serif" y="38" font-size="32" font-weight="300" fill="#EAFBFF">SQLite</text></g><g transform="translate(800,214)" class="in" style="animation-delay:0.7s"><text class="mono" font-size="10.5" letter-spacing="2" fill="#00D9FF">BUILT ON</text><text class="serif" y="38" font-size="32" font-weight="300" fill="#EAFBFF">Android</text></g></svg>