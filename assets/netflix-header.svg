<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="TEJAS - A Tejas Original Series Banner">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <!-- Netflix Red Radial Spotlight -->
    <radialGradient id="red-spotlight" cx="20%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#E50914" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Circuit Spotlight for Right Side -->
    <radialGradient id="cyber-glow" cx="85%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#1f0305" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#141414" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom Vignette Fade to Match Dark GitHub Theme -->
    <linearGradient id="bottom-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414" stop-opacity="0" />
      <stop offset="70%" stop-color="#141414" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#141414" stop-opacity="1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="film-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>

    <!-- Glow Filter for Logo and Highlights -->
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    
    /* Animations with solid fallback for static & GitHub markdown rendering */
    .fade-up {
      opacity: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .delay-1 { animation-delay: 0.15s; }
    .delay-2 { animation-delay: 0.3s; }
    .delay-3 { animation-delay: 0.45s; }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .pulse {
      animation: pulseAnim 3s ease-in-out infinite alternate;
    }
    @keyframes pulseAnim {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.02); }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .fade-up, .pulse { animation: none; }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="500" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="500" rx="16" fill="url(#red-spotlight)" />
  <rect width="1200" height="500" rx="16" fill="url(#cyber-glow)" />
  <rect width="1200" height="500" rx="16" fill="url(#film-grid)" />

  <!-- Top Navigation Bar (Netflix UI) -->
  <g transform="translate(48, 28)">
    <!-- Red Logo -->
    <g transform="translate(0, 0)">
      <text class="font-sans" x="0" y="24" font-size="28" font-weight="900" letter-spacing="2" fill="#E50914" filter="url(#red-glow)">TEJAS</text>
    </g>

    <!-- Nav Items -->
    <g class="font-sans" font-size="13" font-weight="500" fill="#e5e5e5" transform="translate(130, 20)">
      <text x="0" y="0" font-weight="700" fill="#ffffff">Home</text>
      <text x="64" y="0" fill="#b3b3b3">Series</text>
      <text x="130" y="0" fill="#b3b3b3">Projects</text>
      <text x="210" y="0" fill="#b3b3b3">Tech Stack</text>
      <text x="310" y="0" fill="#b3b3b3">New &amp; Popular</text>
      <text x="430" y="0" fill="#b3b3b3">My List</text>
    </g>

    <!-- Nav Right: Search, Bell, Profile -->
    <g transform="translate(1040, 10)">
      <!-- Search Icon -->
      <circle cx="0" cy="0" r="6" fill="none" stroke="#e5e5e5" stroke-width="1.8" />
      <line x1="4.5" y1="4.5" x2="10" y2="10" stroke="#e5e5e5" stroke-width="1.8" stroke-linecap="round" />

      <!-- Notification Bell -->
      <g transform="translate(32, -4)">
        <path d="M 0 10 C 0 5, 2 1, 6 1 C 10 1, 12 5, 12 10 L 14 13 L -2 13 Z" fill="none" stroke="#e5e5e5" stroke-width="1.6" />
        <circle cx="6" cy="15" r="1.5" fill="#e5e5e5" />
        <circle cx="12" cy="1" r="3" fill="#E50914" />
      </g>

      <!-- Profile Avatar -->
      <g transform="translate(62, -8)">
        <rect width="26" height="26" rx="4" fill="#E50914" />
        <circle cx="13" cy="9" r="4.5" fill="#ffffff" />
        <path d="M 6 22 C 6 17, 10 15, 13 15 C 16 15, 20 17, 20 22" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- Right Side Poster / Billboard Graphic -->
  <g transform="translate(770, 75)" opacity="0.9">
    <!-- Ambient Backdrop Card with Perspective Angle -->
    <rect x="50" y="30" width="310" height="340" rx="14" fill="#181818" stroke="#333" stroke-width="1" opacity="0.6" transform="rotate(4, 205, 200)" />
    <!-- Foreground Card -->
    <rect x="20" y="20" width="330" height="350" rx="14" fill="#121212" stroke="#E50914" stroke-opacity="0.4" stroke-width="1.5" />
    
    <!-- Neon circuit & terminal aesthetic inside card -->
    <rect x="36" y="36" width="298" height="170" rx="8" fill="#0d0d0d" />
    
    <!-- Binary/Code matrix subtle glow -->
    <g class="font-mono" font-size="9" fill="#E50914" opacity="0.45">
      <text x="48" y="58">01010100 01000101 01001010 01000001</text>
      <text x="48" y="74">DEVICE: /dev/ttyUSB0 [CONNECTED]</text>
      <text x="48" y="90">OS: Linux (Android 14 / Termux)</text>
      <text x="48" y="106">MODEL: Llama-3-Router &amp; Ultrasonic-Sonar</text>
      <text x="48" y="122">STATUS: SHIPPING PRODUCTION CODE...</text>
      <text x="48" y="138">&gt; make flash &amp;&amp; python3 server.py</text>
      <text x="48" y="154">[OK] 200 SUCCESS - 0 ERRORS FOUND</text>
      <text x="48" y="170">&gt; tejas@termux:~$ git push origin main</text>
    </g>

    <!-- Radar / Wave Vector Graphic -->
    <g transform="translate(260, 105)" stroke="#E50914" fill="none" opacity="0.8">
      <circle cx="0" cy="0" r="16" stroke-width="1" stroke-dasharray="2 3" />
      <circle cx="0" cy="0" r="32" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="0" cy="0" r="48" stroke-width="1" stroke-opacity="0.3" />
      <line x1="0" y1="0" x2="34" y2="-34" stroke-width="1.5" />
      <circle cx="34" cy="-34" r="3" fill="#E50914" />
    </g>

    <!-- Card Inner Title & Details -->
    <text class="font-sans" x="40" y="235" font-size="11" font-weight="700" letter-spacing="2" fill="#E50914">NOW STREAMING</text>
    <text class="font-sans" x="40" y="265" font-size="22" font-weight="800" fill="#ffffff">SEASON 2: BUILD &amp; SHIP</text>
    <text class="font-sans" x="40" y="292" font-size="12" fill="#a3a3a3">From microcontroller firmware to LLM routing.</text>
    <text class="font-sans" x="40" y="310" font-size="12" fill="#a3a3a3">Pure engineering, zero excuses.</text>

    <!-- Mini Netflix Pill Tag on Poster -->
    <g transform="translate(40, 330)">
      <rect width="64" height="20" rx="3" fill="#E50914" />
      <text class="font-sans" x="32" y="14" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">ORIGINAL</text>
    </g>
    <g transform="translate(112, 330)">
      <rect width="78" height="20" rx="3" fill="#262626" />
      <text class="font-sans" x="39" y="14" font-size="10" font-weight="700" fill="#46d369" text-anchor="middle">99% MATCH</text>
    </g>
    <g transform="translate(198, 330)">
      <rect width="36" height="20" rx="3" fill="#262626" />
      <text class="font-sans" x="18" y="14" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4K</text>
    </g>
  </g>

  <!-- Left Main Hero Content -->
  <g transform="translate(68, 88)">
    <!-- Netflix Series Brand Bar -->
    <g class="fade-up">
      <rect x="0" y="3" width="16" height="22" rx="2" fill="#E50914" />
      <text class="font-sans" x="8" y="19" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">T</text>
      <text class="font-sans" x="26" y="19" font-size="12" font-weight="800" letter-spacing="5" fill="#b3b3b3">SERIES</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 40)" class="fade-up delay-1">
      <text class="font-sans" x="0" y="65" font-size="78" font-weight="900" letter-spacing="2" fill="#ffffff">TEJAS<tspan fill="#E50914">.</tspan></text>
    </g>

    <!-- Netflix Meta Badges Row -->
    <g transform="translate(0, 132)" class="font-sans fade-up delay-1">
      <!-- 99% Match in vibrant green -->
      <text x="0" y="14" font-size="15" font-weight="800" fill="#46d369">99% Match</text>
      <text x="96" y="14" font-size="14" font-weight="600" fill="#999999">2026</text>
      
      <!-- TV-14 Box -->
      <g transform="translate(144, -2)">
        <rect width="48" height="22" rx="3" fill="none" stroke="#666666" stroke-width="1.2" />
        <text x="24" y="15" font-size="11" font-weight="700" fill="#d9d9d9" text-anchor="middle">TV-14</text>
      </g>
      
      <text x="206" y="14" font-size="14" font-weight="600" fill="#999999">2 Seasons</text>

      <!-- Ultra HD 4K Badge -->
      <g transform="translate(292, -2)">
        <rect width="42" height="22" rx="3" fill="none" stroke="#666666" stroke-width="1.2" />
        <text x="21" y="15" font-size="11" font-weight="700" fill="#d9d9d9" text-anchor="middle">4K</text>
      </g>

      <!-- Spatial Audio Badge -->
      <g transform="translate(344, -2)">
        <rect width="58" height="22" rx="3" fill="none" stroke="#666666" stroke-width="1.2" />
        <text x="29" y="15" font-size="11" font-weight="700" fill="#d9d9d9" text-anchor="middle">AUDIO</text>
      </g>
    </g>

    <!-- Top 10 Ranking Ribbon -->
    <g transform="translate(0, 172)" class="font-sans fade-up delay-2">
      <rect width="28" height="28" rx="4" fill="#E50914" />
      <text x="14" y="18" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">#1</text>
      <text x="38" y="19" font-size="15" font-weight="800" letter-spacing="1" fill="#ffffff">#1 in Tech &amp; Engineering Today</text>
    </g>

    <!-- Description Logline -->
    <g transform="translate(0, 218)" class="font-sans fade-up delay-2">
      <text x="0" y="18" font-size="15.5" font-weight="400" fill="#e5e5e5">A 2nd-year B.Tech ECE student with a CSE Minor at TGPCET (RTMNU), Wardha.</text>
      <text x="0" y="42" font-size="15.5" font-weight="400" fill="#cccccc">Cracking GATE EC, engineering embedded hardware &amp; AI/ML systems, and</text>
      <text x="0" y="66" font-size="15.5" font-weight="500" fill="#ffffff">shipping entire production applications directly from an Android phone using Termux.</text>
    </g>

    <!-- Action Buttons Row -->
    <g transform="translate(0, 305)" class="font-sans fade-up delay-3">
      <!-- Play Button -->
      <g style="cursor: pointer;">
        <rect width="130" height="42" rx="6" fill="#ffffff" />
        <path d="M 32 14 L 46 21 L 32 28 Z" fill="#000000" />
        <text x="56" y="27" font-size="16" font-weight="800" fill="#000000">Play</text>
      </g>

      <!-- My List Button -->
      <g transform="translate(144, 0)" style="cursor: pointer;">
        <rect width="150" height="42" rx="6" fill="#4d4d4d" fill-opacity="0.6" stroke="#8c8c8c" stroke-width="1.2" />
        <path d="M 30 21 L 42 21 M 36 15 L 36 27" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
        <text x="52" y="27" font-size="15" font-weight="700" fill="#ffffff">My List</text>
      </g>

      <!-- More Info Button -->
      <g transform="translate(308, 0)" style="cursor: pointer;">
        <rect width="154" height="42" rx="6" fill="#4d4d4d" fill-opacity="0.4" stroke="#666666" stroke-width="1" />
        <circle cx="34" cy="21" r="9" fill="none" stroke="#ffffff" stroke-width="1.8" />
        <text x="34" y="25" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">i</text>
        <text x="54" y="27" font-size="15" font-weight="600" fill="#ffffff">More Info</text>
      </g>
    </g>
  </g>

  <!-- Bottom Vignette Gradient to smoothly blend into markdown page -->
  <rect y="440" width="1200" height="60" fill="url(#bottom-fade)" />
</svg>