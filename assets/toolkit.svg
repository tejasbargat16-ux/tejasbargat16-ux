M APIs</text></g><g class="card" style="animation-delay:0.45s"><rect x="40" y="190" width="360" height="130" rx="14" fill="#050B11" stroke="#00D9FF" stroke-opacity=".3"/><circle cx="68" cy="222" r="5" fill="#00D9FF"><animate attributeName="opacity" values="1;.3;1" dur="3.2s" repeatCount="indefinite"/></circle><text class="mono" x="84" y="226" font-size="11" letter-spacing="2.6" fill="#00D9FF">TOOLS</text><text class="serif" x="62" y="272" font-size="19" font-weight="300" fill="#EAFBFF">Git · GitHub · Termux · VS</text><text class="serif" x="62" y="300" font-size="19" font-weight="300" fill="#EAFBFF">Code · Linux</text></g><g class="card" style="animation-delay:0.60s"><rect x="420" y="190" width="360" height="130" rx="14" fill="#050B11" stroke="#00D9FF" stroke-opacity=".3"/><circle cx="448" cy="222" r="5" fill="#00D9FF"><animate attributeName="opacity" values="1;.3;1" dur="3.6s" repeatCount="indefinite"/></circle><text class="mono" x="464" y="226" font-size="11" letter-spacing="2.6" fill="#00D9FF">DATA</text><text class="serif" x="442" y="272" font-size="19" font-weight="300" fill="#EAFBFF">SQLite</text></g><g class="card" style="animation-delay:0.75s"><rect x="800" y="190" width="360" height="130" rx="14" fill="#050B11" stroke="#00D9FF" stroke-opacity=".3"/><circle cx="828" cy="222" r="5" fill="#00D9FF"><animate attributeName="opacity" values="1;.3;1" dur="4.0s" repeatCount="indefinite"/></circle><text class="mono" x="844" y="226" font-size="11" letter-spacing="2.6" fill="#00D9FF">INTERESTS</text><text class="serif" x="822" y="272" font-size="19" font-weight="300" fill="#EAFBFF">AI/ML · IoT · Cybersecurity ·</text><text class="serif" x="822" y="300" font-size="19" font-weight="300" fill="#EAFBFF">OSINT</text></g></svg>