<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Tech stack. Languages: Python, Java, C/C++, JavaScript. Embedded: Arduino, 8051, sensors, digital logic. Web and API: HTML, CSS, JavaScript, Flask, REST, LLM APIs. Tools: Git, GitHub, Termux, VS Code, Linux. Data: SQLite. Interests: AI/ML, IoT, cybersecurity, OSINT.">
<defs><linearGradient id="tb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07121A"/><stop offset="1" stop-color="#050B11"/></linearGradient></defs><style>
.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.in{animation:in 1.1s cubic-bezier(.16,1,.3,1) both}.d2{animation-delay:.2s}.d3{animation-delay:.45s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.in{animation:none}.draw{animation:none;stroke-dashoffset:0}}
</style>
<style>.card{animation:in 1s cubic-bezier(.16,1,.3,1) both}@media (prefers-reduced-motion:reduce){.card{animation:none}}</style>
