<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 540" width="380" height="540" role="img" aria-label="Top 1: NEXUS Chat">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="c1-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0708" />
      <stop offset="35%" stop-color="#141414" />
      <stop offset="70%" stop-color="#0d0d0d" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Crimson Glow -->
    <radialGradient id="c1-glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#E50914" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#141414" stop-opacity="0" />
    </radialGradient>

    <!-- Overlay Shadow for Bottom Text -->
    <linearGradient id="c1-vignette" x1="0%" y1="40%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
    </linearGradient>

    <!-- Top 10 Giant 3D Number Stroke Gradient -->
    <linearGradient id="num-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#888888" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#222222" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Card Frame -->
  <rect width="380" height="540" rx="16" fill="url(#c1-bg)" />
  <rect width="380" height="540" rx="16" fill="url(#c1-glow)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="378" height="538" rx="15" fill="none" stroke="#E50914" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Top Badges Row -->
  <g transform="translate(20, 20)">
    <!-- Red N Icon -->
    <rect width="22" height="28" rx="3" fill="#E50914" />
    <path d="M 5 6 L 5 22 M 17 6 L 17 22 M 5 6 L 17 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- TOP 10 Badge -->
    <g transform="translate(30, 0)">
      <rect width="78" height="20" rx="3" fill="#E50914" />
      <text class="font-sans" x="39" y="14" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">TOP 10</text>
    </g>

    <!-- 99% Match Badge -->
    <g transform="translate(250, 0)">
      <rect width="90" height="20" rx="3" fill="#222222" stroke="#333333" stroke-width="1" />
      <text class="font-sans" x="45" y="14" font-size="11" font-weight="800" fill="#46d369" text-anchor="middle">99% MATCH</text>
    </g>
  </g>

  <!-- Giant Netflix-Styled Rank Number "1" -->
  <g transform="translate(14, 150)">
    <!-- Shadow stroke -->
    <text class="font-sans" x="0" y="160" font-size="210" font-weight="900" fill="#141414" stroke="#444444" stroke-width="4" opacity="0.6">1</text>
    <!-- Highlight stroke -->
    <text class="font-sans" x="-3" y="157" font-size="210" font-weight="900" fill="#080808" stroke="url(#num-stroke)" stroke-width="2.5">1</text>
  </g>

  <!-- Project Artwork Visual: AI Neural Core & Terminal -->
  <g transform="translate(150, 100)">
    <!-- Cyber Core Hexagon / Neural Synapses -->
    <circle cx="90" cy="90" r="75" fill="none" stroke="#E50914" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="90" cy="90" r="50" fill="#1a0405" stroke="#E50914" stroke-opacity="0.5" stroke-width="2" />
    <circle cx="90" cy="90" r="26" fill="#E50914" fill-opacity="0.2" stroke="#ff3843" stroke-width="1.5" />
    
    <!-- Central AI Neural Icon -->
    <g stroke="#ffffff" stroke-width="1.5" fill="none">
      <circle cx="90" cy="90" r="8" fill="#E50914" />
      <line x1="90" y1="70" x2="90" y2="82" />
      <circle cx="90" cy="67" r="3.5" fill="#ffffff" />
      <line x1="72" y1="102" x2="82" y2="95" />
      <circle cx="69" cy="104" r="3.5" fill="#ffffff" />
      <line x1="108" y1="102" x2="98" y2="95" />
      <circle cx="111" cy="104" r="3.5" fill="#ffffff" />
    </g>

    <!-- Radiating Wave lines -->
    <path d="M 30 90 A 60 60 0 0 1 150 90" fill="none" stroke="#E50914" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="2 4" />
    <path d="M 20 90 A 70 70 0 0 0 160 90" fill="none" stroke="#E50914" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="3 5" />

    <!-- Terminal Code Floating Snippet -->
    <g transform="translate(10, 160)">
      <rect width="175" height="34" rx="6" fill="#0d0d0d" stroke="#333" stroke-width="1" />
      <text class="font-mono" x="12" y="21" font-size="10" fill="#46d369">&gt; nexus.route(llm)</text>
    </g>
  </g>

  <!-- Vignette overlay for text legibility -->
  <rect y="240" width="380" height="300" rx="16" fill="url(#c1-vignette)" />

  <!-- Content & Metadata at Bottom -->
  <g transform="translate(24, 380)">
    <!-- Subtitle / Tag -->
    <text class="font-sans" x="0" y="0" font-size="11" font-weight="800" letter-spacing="2" fill="#E50914">LIMITED SERIES · AI/ML</text>

    <!-- Main Title -->
    <text class="font-sans" x="0" y="32" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.5">NEXUS Chat</text>

    <!-- Synopsis -->
    <text class="font-sans" x="0" y="58" font-size="12.5" font-weight="400" fill="#cccccc">
      Terminal AI with multi-provider LLM
    </text>
    <text class="font-sans" x="0" y="76" font-size="12.5" font-weight="400" fill="#cccccc">
      routing, Flask API &amp; persistent SQLite storage.
    </text>

    <!-- Tags / Tech Pill row -->
    <g transform="translate(0, 96)">
      <g>
        <rect width="56" height="22" rx="4" fill="#222" stroke="#333" stroke-width="1" />
        <text class="font-sans" x="28" y="15" font-size="10.5" font-weight="700" fill="#e5e5e5" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(62, 0)">
        <rect width="48" height="22" rx="4" fill="#222" stroke="#333" stroke-width="1" />
        <text class="font-sans" x="24" y="15" font-size="10.5" font-weight="700" fill="#e5e5e5" text-anchor="middle">Flask</text>
      </g>
      <g transform="translate(116, 0)">
        <rect width="68" height="22" rx="4" fill="#222" stroke="#333" stroke-width="1" />
        <text class="font-sans" x="34" y="15" font-size="10.5" font-weight="700" fill="#e5e5e5" text-anchor="middle">LLM APIs</text>
      </g>
      <g transform="translate(190, 0)">
        <rect width="58" height="22" rx="4" fill="#222" stroke="#333" stroke-width="1" />
        <text class="font-sans" x="29" y="15" font-size="10.5" font-weight="700" fill="#e5e5e5" text-anchor="middle">Termux</text>
      </g>
      <g transform="translate(254, 0)">
        <rect width="32" height="22" rx="4" fill="#E50914" />
        <path d="M 12 6 L 22 11 L 12 16 Z" fill="#ffffff" />
      </g>
    </g>
  </g>
</svg>
