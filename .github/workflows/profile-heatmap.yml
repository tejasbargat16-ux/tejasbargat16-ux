name: Refresh profile heatmap

on:
  schedule:
    # Daily at 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-heatmap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Public calendar data only; no token is written anywhere.
      - name: Fetch contributions
        env:
          GH_USERNAME: ${{ github.repository_owner }}
        run: node scripts/fetch-contributions.mjs

      - name: Render heatmap SVG & sync assets
        run: node generate.mjs

      - name: Commit if changed
        run: |
          git add site/data/contributions.json assets/contribution-snake.svg site/assets/contribution-snake.svg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution heatmap"
          git push
