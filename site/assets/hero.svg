<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Tejas Bargat — ECE Original. 2nd-year Electronics and Communication Engineering with a minor in Computer Science. Embedded, IoT, AI/ML, web and cybersecurity, built on Android."><defs><linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#000000" stop-opacity=".95"/><stop offset=".55" stop-color="#000000" stop-opacity=".55"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient>
