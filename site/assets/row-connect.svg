<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70" role="img" aria-label="Coming Soon — Let&#x27;s Connect"><defs></defs><style>.d{font-family:Impact,"Bebas Neue","Arial Narrow",Haettenschweiler,sans-serif;letter-spacing:1px}.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.in{animation:in 1s cubic-bezier(.16,1,.3,1) both}.d2{animation-delay:.2s}.d3{animation-delay:.45s}.d4{animation-delay:.7s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 2s cubic-bezier(.65,0,.35,1) .6s both}
@media (prefers-reduced-motion:reduce){.in,.bar{animation:none}}</style><g class="in"><rect x="60" y="22" width="5" height="30" fill="#E50914"/><text class="s" x="80" y="46" font-size="26" font-weight="700" fill="#FFFFFF">Coming Soon — Let&#x27;s Connect</text>
<text class="s" x="472" y="46" font-size="15" font-weight="700" fill="#E50914" opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;.5;1" dur="2s" fill="freeze"/></text></g></svg>